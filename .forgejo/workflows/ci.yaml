name: CI

# Runs on every pull request into main. Branch protection on main requires
# both jobs to pass before the pull request can be merged.

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: docker
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The same version as the deploy workflow, which wrote bun.lockb.
      - name: Install Bun
        run: npm install --global bun@1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  # Runs the same build the deploy workflow publishes, so a pull request
  # that breaks the static export fails here rather than after merge.
  # Nothing is published.
  build:
    runs-on: docker
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Bun
        run: npm install --global bun@1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # next build, then the resized images and feed.xml (see package.json).
      - name: Build
        run: bun run build

      - name: Check the export
        run: |
          for path in index.html 404.html articles/index.html feed.xml favicon.ico; do
            test -s "out/${path}" || { echo "out/${path} is missing" >&2; exit 1; }
          done
