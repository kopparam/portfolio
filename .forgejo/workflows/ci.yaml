name: CI

# Runs on every pull request into main. Branch protection on main requires
# both jobs to pass before the pull request can be merged.

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: docker
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Same major version as the Dockerfile, which takes the binary from
      # oven/bun:1.
      - name: Install Bun
        run: npm install --global bun@1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  # Builds the same image the deploy workflow ships, so a pull request that
  # breaks the Dockerfile or next build fails here rather than after merge.
  # Nothing is pushed.
  build:
    runs-on: docker
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The job container has node (for the JS actions) but no docker client.
      # The daemon itself is the host's, mounted in by the runner.
      - name: Install the Docker CLI
        run: |
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y --no-install-recommends docker-ce-cli

      - name: Build
        run: docker build --tag "portfolio-ci:${{ github.run_id }}" .

      # The daemon is the host's, so clean up rather than leave an image per
      # pull request run on it.
      - name: Remove the image
        if: always()
        run: docker image rm "portfolio-ci:${{ github.run_id }}" || true
